  // ===== 5. Cold, dead plants, collapsing food chain (58.9 – 72.5) =====
  {at:AT.cold, build:function(g,tl,K){

  // ===== 6. Extinction, then a new chapter for mammals (72.5 – 89.56) =====
  {at:AT.end, build:function(g,tl,K){
    var S=K.S, T=K.T, L=function(t){return t-AT.end;};
    // a. Fossil in rock layers
    var a=sub(S,g,'#6a5040');
    [['#8a6a4a',200],['#7a5a3a',280],['#6a4a2e',360],['#5a3e26',440],['#4a3220',520]].forEach(function(l){ S('rect',{x:0,y:l[1],width:360,height:80,fill:l[0]},a); });
    var bones=S('g',{opacity:0},a);
    S('path',{d:'M70 420 Q130 380 200 392 Q250 400 300 380',fill:'none',stroke:'#efe3cc','stroke-width':6,'stroke-linecap':'round'},bones);
    for(var r=0;r<7;r++) S('path',{d:'M'+(120+r*18)+' '+(392-(r%2))+' q4 30 -6 46',fill:'none',stroke:'#efe3cc','stroke-width':4,'stroke-linecap':'round'},bones);

    K.slam(tl,tExt,L(73.6));
    K.hide(tl,tExt,L(75.5));

    cut(tl,a,b,L(75.6));
    var tPct=T(g,'',180,120,54,'#e4572e',{sw:6,ltr:true});
    K.count(tl,tPct,function(v){return v+'%';},0,75,L(76.8),1.2);
    K.slam(tl,tPct,L(76.8));
    dots.forEach(function(d,i){ if(i<15) tl.to(d,{attr:{fill:'#4a4a55'},duration:0.15},L(76.9)+i*0.07); });
    var tLife=T(g,'من أشكال الحياة',180,166,26,'#ffffff');
    K.slide(tl,tLife,L(77.8));
    K.hide(tl,[tPct,tLife],L(79.3));
    // c. A book closes, a new chapter opens
    var c=sub(S,g,'#14172b');

    var pageR=S('rect',{x:180,y:230,width:120,height:160,rx:4,fill:'#efe0c0'},c);
    var pTxt=T(c,'العمالقة',240,318,22,'#7a2e2e',{show:true,sw:0});
    var flip=S('g',{},c);
    S('rect',{x:180,y:230,width:120,height:160,rx:4,fill:'#e0cfa8'},flip);
    cut(tl,b,c,L(79.3));
    var tFold=T(g,'طُوي فصل العمالقة',180,120,34,'#ffd166');
    K.slam(tl,tFold,L(79.5));
    tl.fromTo(flip,{scaleX:1,svgOrigin:'180 310'},{scaleX:-1,svgOrigin:'180 310',duration:0.9,ease:'power2.inOut'},L(80.3));
    tl.to(pTxt,{opacity:0,duration:0.2},L(80.5));
    K.hide(tl,tFold,L(81.8));
    // d. Small mammals survive and evolve
    var d=sub(S,g,'#bfe3f0');
    var sun=S('circle',{cx:290,cy:110,r:34,fill:'#ffd166',opacity:0},d);

    var mm=mammal(S,d,110,440,1.3);

    var monkey=S('g',{},evo);
    S('ellipse',{cx:190,cy:282,rx:16,ry:20,fill:'#8a6a4a'},monkey); S('circle',{cx:190,cy:252,r:13,fill:'#8a6a4a'},monkey); S('circle',{cx:190,cy:254,r:8,fill:'#c99a70'},monkey);
    S('path',{d:'M206 290 Q226 300 222 270',fill:'none',stroke:'#8a6a4a','stroke-width':4},monkey);
    S('path',{d:'M232 286 L260 286 M252 278 L260 286 L252 294',fill:'none',stroke:'#1d2b48','stroke-width':3,'stroke-linecap':'round'},evo);
    K.person(evo,296,310,0.8,{shirt:'#2e5cb8',skin:'#e0b08a',hair:'#2d2440'});

    K.slam(tl,tToday,L(87.0));
  }}
  ]
});
