# Tasaalt Studio — cloud worker. Started by the studio server; do not run by hand.
# The studio address and key live in encrypted repository secrets (STUDIO_SERVER, STUDIO_KEY),
# so nothing private appears in the run logs even when this repository is public.
name: studio
run-name: "${{ inputs.task }} · ${{ inputs.job }}"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "ping | preview | render | align | generate"
        required: true
        default: ping
      job:
        description: "Job id"
        required: true

permissions:
  contents: read

jobs:
  work:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install speech model (alignment only)
        if: inputs.task == 'align'
        run: npm install --no-save --no-audit --no-fund @xenova/transformers@2.17.2 sts-whisper-tiny@1.0.0

      - name: Work
        run: node worker.js
        env:
          TASK: ${{ inputs.task }}
          JOB: ${{ inputs.job }}
          SERVER: ${{ secrets.STUDIO_SERVER }}
          STUDIO_KEY: ${{ secrets.STUDIO_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}

      - name: Report failure to the studio
        if: failure() || cancelled()
        env:
          JOB: ${{ inputs.job }}
          SERVER: ${{ secrets.STUDIO_SERVER }}
          STUDIO_KEY: ${{ secrets.STUDIO_KEY }}
        run: |
          TOKEN=$(printf '%s' "$JOB" | openssl dgst -sha256 -hmac "$STUDIO_KEY" | awk '{print $NF}')
          curl -sS -m 30 -X POST -H "Content-Type: application/json" \
            -d '{"ok":false,"error":"توقف العامل السحابي (فشل التثبيت أو أُلغي التشغيل). راجع سجل GitHub Actions."}' \
            "$SERVER?a=finish&job=$JOB&t=$TOKEN" || true
